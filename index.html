<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>levs solar system</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d1f; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cdd3f0;
        text-align: center;
        letter-spacing: 0.04em;
        background: rgba(10, 13, 31, 0.55);
        padding: 10px 20px;
        border-radius: 10px;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #hud.faded { opacity: 0.18; }
      #hud b { color: #ffd9a8; font-weight: 600; }

      /* Per-planet panel: whichever world you're standing on, and its scroll. */
      #planet-panel {
        position: fixed;
        top: 24px;
        left: 24px;
        min-width: 208px;
        padding: 14px 18px 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e6e9fb;
        background: rgba(16, 13, 38, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 12px;
        pointer-events: none;
        backdrop-filter: blur(6px);
      }
      #planet-panel .planet-name {
        font-size: 17px;
        letter-spacing: 0.06em;
        color: #ffe3b8;
        margin-bottom: 9px;
      }
      #planet-panel .item-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #planet-panel .chip {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        transform: rotate(45deg);
        opacity: 0.4;
        flex: none;
      }
      #planet-panel .chip.found { opacity: 1; box-shadow: 0 0 9px currentColor; }
      #planet-panel .item-name { color: #cfd5f2; }
      #planet-panel .item-state {
        margin-left: auto;
        font-size: 11px;
        color: #7d84ac;
      }
      #planet-panel .item-state.found { color: #86e5a8; }
      #planet-panel .progress {
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11px;
        color: #8b91b8;
      }

      #toast {
        position: fixed;
        top: 62px;
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: max-content;
        max-width: 96vw;
        font: 22px/1.32 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
        color: #2e2419;
        padding: 56px 90px 52px;
        border-radius: 0;
        border: 0;
        background: url('/src/images/parchment_transparent.png') center / 100% 100% no-repeat;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #toast .toast-text {
        display: block;
        width: max-content;
        max-width: min(72vw, 30ch);
        text-align: center;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: normal;
      }

      #aim-dot {
        position: fixed;
        width: 10px;
        height: 10px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #ffe3b8;
        border: 1px solid rgba(12, 13, 26, 0.9);
        box-shadow: 0 0 0 2px rgba(255, 227, 184, 0.24);
        pointer-events: none;
        z-index: 12;
        opacity: 0.95;
        transition: opacity 0.12s ease;
      }
      #aim-dot.hidden { opacity: 0; }

      #interact-hint {
        position: fixed;
        left: 50%;
        top: 22px;
        transform: translateX(-50%);
        font: 14px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.05em;
        color: #bcdfff;
        background: rgba(16, 13, 38, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 5px 10px;
        pointer-events: none;
        z-index: 12;
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      #interact-hint.on { opacity: 1; }

      #sound-toggle {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 13;
        pointer-events: auto;
        padding: 8px 12px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(16, 13, 38, 0.78);
        color: #e6e9fb;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      }
      #sound-toggle:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 12px rgba(255, 227, 184, 0.2);
        border-color: rgba(255, 227, 184, 0.45);
      }

      #album-hint {
        position: fixed;
        left: 50%;
        bottom: 94px;
        transform: translateX(-50%);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.05em;
        color: #ffe9bf;
        background: rgba(19, 15, 37, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #album-hint.on { opacity: 1; }

      /* The shelf of scrolls you've found. */
      #planet-panel .shelf {
        display: flex;
        gap: 7px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      #planet-panel .shelf.nudge { animation: nudge 0.9s ease; }
      @keyframes nudge {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
      }
      .scroll-button {
        width: 20px;
        height: 20px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        background: #241f47;
        cursor: pointer;
        pointer-events: auto;
        position: relative;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .scroll-button::after {
        content: '';
        position: absolute;
        inset: 4px;
        border-radius: 2px;
        background: var(--ink);
        opacity: 0.22;
      }
      .scroll-button:disabled { cursor: default; opacity: 0.45; }
      .scroll-button:not(:disabled)::after { opacity: 1; }
      .scroll-button:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 0 10px var(--ink);
      }

      /* The journal: plain white paper, in the same monospace the rest of
         the interface uses. */
      #journal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(8, 7, 20, 0.5);
        backdrop-filter: blur(3px);
        z-index: 10;
      }
      #journal.on { display: flex; }

      #journal .paper {
        width: min(520px, 82vw);
        max-height: 76vh;
        overflow-y: auto;
        padding: 24px 28px 20px;
        background: #ffffff;
        color: #22232a;
        border-radius: 4px;
        box-shadow: 0 20px 64px rgba(0, 0, 0, 0.55);
        font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #journal .paper-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 12px;
        color: #6b6f7d;
        padding-bottom: 10px;
        border-bottom: 1px solid #e4e6ec;
      }
      #journal .paper-count { letter-spacing: 0.06em; }

      #journal .paper-list { display: block; }
      #journal .paper.reading .paper-list { display: none; }
      #journal .paper-read { display: none; }
      #journal .paper.reading .paper-read { display: block; }

      #journal .entry {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 6px;
        margin: 0;
        text-align: left;
        font: inherit;
        color: #a6aab5;
        background: none;
        border: 0;
        border-bottom: 1px solid #f0f1f5;
        cursor: default;
        pointer-events: auto;
      }
      #journal .entry.found { color: #22232a; cursor: pointer; }
      #journal .entry.found:hover { background: #f5f6f9; }
      #journal .entry-dot {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        flex: none;
        background: var(--ink);
        opacity: 0.25;
      }
      #journal .entry.found .entry-dot { opacity: 1; }
      #journal .entry-where { min-width: 74px; letter-spacing: 0.04em; }
      #journal .entry-what { color: #8b8f9b; }
      #journal .entry.found .entry-what { color: #4a4e5a; }

      #journal .read-title {
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 12px;
        color: #6b6f7d;
        margin: 14px 0 14px;
      }
      #journal .read-body { font-size: 14px; line-height: 1.85; }
      #journal .read-body p { margin: 0 0 14px; }
      #journal .read-body p:last-child { margin-bottom: 0; }

      #journal .paper-foot {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #e4e6ec;
      }
      #journal .paper-action {
        padding: 6px 14px;
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.06em;
        color: #5a5e6a;
        background: #f4f5f8;
        border: 1px solid #dfe1e8;
        border-radius: 3px;
        cursor: pointer;
        pointer-events: auto;
      }
      #journal .paper-action:hover { background: #e9ebf1; color: #22232a; }
      #journal .paper-read .paper-action { margin-top: 18px; }

      #album-viewer {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 5, 16, 0.64);
        backdrop-filter: blur(3px);
        z-index: 11;
      }
      #album-viewer.on { display: flex; }

      /* Width is set per photo from its aspect ratio (see fitAlbumCard), so the
         card is as wide as the picture wants to be. The fallback covers the
         moment before the first image reports its size. */
      #album-viewer .album-card {
        width: var(--album-w, min(720px, 88vw));
        min-width: min(280px, 86vw);
        max-width: 88vw;
        max-height: 82vh;
        overflow: auto;
        transition: width 0.18s ease;
        padding: 18px;
        border-radius: 12px;
        background: #f8f1e3;
        color: #2b2222;
        border: 1px solid #ddcfae;
        box-shadow: 0 22px 62px rgba(0, 0, 0, 0.52);
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #album-viewer .album-title {
        text-transform: uppercase;
        letter-spacing: 0.11em;
        font-size: 12px;
        color: #614a39;
        margin-bottom: 10px;
      }
      #album-viewer .album-image {
        display: block;
        width: 100%;
        height: auto;
        /* The card is already sized to the photo, so these only bite in the
           edge case where min-width wins — contain keeps it undistorted. */
        max-height: min(54vh, 420px);
        object-fit: contain;
        /* Transparent until the load handler says the photo is really there. */
        opacity: 0;
        transition: opacity 0.2s ease;
        border-radius: 8px;
        border: 1px solid #ccb994;
        background: repeating-linear-gradient(
          -45deg,
          #eadcc2,
          #eadcc2 12px,
          #efe6d3 12px,
          #efe6d3 24px
        );
      }
      #album-viewer .album-image.ready { opacity: 1; }
      /* Holds the frame open while the next photo decodes, so the card doesn't
         collapse and snap back open between pictures. */
      #album-viewer .album-card.loading .album-image {
        height: min(54vh, 420px);
      }
      #album-viewer .album-index {
        margin-top: 10px;
        color: #694f37;
        letter-spacing: 0.06em;
      }
      #album-viewer .album-controls {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      #album-viewer .album-action {
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid #cfbb96;
        background: #f0e2c5;
        color: #493827;
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      #album-viewer .album-action:hover { background: #e8d5b1; }

      /* Press P. Numbers from your own GPU, not from a guess. */
      #perf {
        position: fixed;
        top: 24px;
        right: 24px;
        padding: 10px 14px;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfe6ff;
        background: rgba(10, 13, 31, 0.72);
        border-radius: 9px;
        white-space: pre;
        pointer-events: none;
        display: none;
      }
      #perf.on { display: block; }

      /* Startup. There is ~80 MB of models behind this, so give it something
         to watch rather than a blank screen. The enter button is also the
         click the browser's autoplay policy wants, which is what lets the
         planet music start on a reload. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        /* Not flat white — a breath of blue at the edges keeps it soft rather
           than clinical. */
        background: radial-gradient(circle at 50% 40%, #ffffff 0%, #eaf3fb 78%);
        font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #7d97ad;
        letter-spacing: 0.04em;
        transition: opacity 0.7s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading-title {
        font-size: 21px;
        letter-spacing: 0.2em;
        color: #5f9fd0;
      }
      /* A little system of its own, spinning until everything has loaded.
         Every animation here is a transform, so the compositor keeps them
         turning even while the main thread is locked up parsing a 29 MB
         model — which is exactly when a frozen spinner looks broken. */
      #loading-orbits {
        position: relative;
        width: 148px;
        height: 148px;
      }
      #loading-sun {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 30%, #ffffff 0%, #bfe3f8 46%, #7cc0ea 100%);
        box-shadow: 0 0 0 7px rgba(142, 201, 238, 0.15), 0 0 24px rgba(95, 159, 208, 0.4);
        animation: loading-breathe 3.4s ease-in-out infinite;
      }
      .loading-orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 1.5px solid rgba(95, 159, 208, 0.19);
        border-radius: 50%;
        will-change: transform;
        animation: loading-orbit linear infinite;
      }
      /* Margins rather than translate(-50%) for centring, which leaves the
         transform free for the spin. */
      .loading-planet {
        position: absolute;
        top: 0;
        left: 50%;
        border-radius: 50%;
        will-change: transform;
        animation: loading-orbit linear infinite;
      }
      .loading-orbit.o1 {
        width: 66px;
        height: 66px;
        margin: -33px 0 0 -33px;
        animation-duration: 2.6s;
      }
      .loading-orbit.o2 {
        width: 106px;
        height: 106px;
        margin: -53px 0 0 -53px;
        animation-duration: 4.3s;
        animation-direction: reverse;
      }
      .loading-orbit.o3 {
        width: 146px;
        height: 146px;
        margin: -73px 0 0 -73px;
        animation-duration: 6.4s;
      }
      /* Counter-spun at its orbit's own rate, so each sphere's highlight stays
         put instead of rolling round with the ring. */
      .o1 .loading-planet {
        width: 11px;
        height: 11px;
        margin: -6px 0 0 -6px;
        animation-duration: 2.6s;
        animation-direction: reverse;
        background: radial-gradient(circle at 32% 28%, #ffffff 0%, #9fd4f4 55%, #6aaedd 100%);
        box-shadow: 0 1px 5px rgba(95, 159, 208, 0.5);
      }
      .o2 .loading-planet {
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        animation-duration: 4.3s;
        background: radial-gradient(circle at 32% 28%, #ffffff 0%, #b9e2f8 55%, #85c4ea 100%);
        box-shadow: 0 1px 6px rgba(95, 159, 208, 0.45);
      }
      .o3 .loading-planet {
        width: 9px;
        height: 9px;
        margin: -5px 0 0 -5px;
        animation-duration: 6.4s;
        animation-direction: reverse;
        background: radial-gradient(circle at 32% 28%, #ffffff 0%, #cbe9fa 55%, #9ad0f0 100%);
        box-shadow: 0 1px 4px rgba(95, 159, 208, 0.4);
      }
      @keyframes loading-orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes loading-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.09); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-sun,
        .loading-orbit,
        .loading-planet {
          animation: none;
        }
      }
      #loading-text {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: #8fb3cb;
        transition: opacity 0.3s ease;
      }
      /* Fades rather than unmounts: the line keeps its space, so nothing
         below it jumps when the enter button arrives. */
      #loading.ready #loading-text { opacity: 0; }
      /* Each dot holds its place and only its opacity changes, so the word
         never jitters and the compositor can keep it going through the jank
         of parsing a big model. */
      .loading-dot {
        opacity: 0;
        animation-duration: 1.2s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .loading-dot.d1 { animation-name: loading-dot-1; }
      .loading-dot.d2 { animation-name: loading-dot-2; }
      .loading-dot.d3 { animation-name: loading-dot-3; }
      @keyframes loading-dot-1 {
        0%, 100% { opacity: 1; }
      }
      @keyframes loading-dot-2 {
        0%, 32.9% { opacity: 0; }
        33%, 100% { opacity: 1; }
      }
      @keyframes loading-dot-3 {
        0%, 65.9% { opacity: 0; }
        66%, 100% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-dot { opacity: 1; animation: none; }
      }
      #loading-enter {
        margin-top: 2px;
        padding: 11px 34px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: #235a80;
        background: #a9d9f5;
        border: 3px solid #8ec9ee;
        border-radius: 999px;
        box-shadow: 0 4px 0 #cbe6f8, 0 8px 18px rgba(95, 159, 208, 0.28);
        cursor: pointer;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: opacity 0.45s ease, transform 0.2s ease, background 0.2s ease,
          box-shadow 0.2s ease;
      }
      #loading-enter.ready {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      #loading-enter:hover {
        color: #ffffff;
        background: #5f9fd0;
        border-color: #4a8dc0;
      }
      /* Presses into the page, cartoon-button style. */
      #loading-enter.ready:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 rgba(95, 159, 208, 0), 0 2px 6px rgba(95, 159, 208, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="loading-title">levs solar system</div>
      <div id="loading-orbits" aria-hidden="true">
        <span id="loading-sun"></span>
        <div class="loading-orbit o1"><span class="loading-planet"></span></div>
        <div class="loading-orbit o2"><span class="loading-planet"></span></div>
        <div class="loading-orbit o3"><span class="loading-planet"></span></div>
      </div>
      <!-- No whitespace between the dots: it would render as gaps. -->
      <div id="loading-text" role="status">loading<span class="loading-dot d1">.</span><span class="loading-dot d2">.</span><span class="loading-dot d3">.</span></div>
      <button id="loading-enter" type="button" disabled>enter</button>
    </div>
    <div id="hud">
      <b>click</b> to look around &nbsp;·&nbsp; <b>WASD</b> walk &nbsp;·&nbsp;
      <b>space</b> jump (hold to leap further) &nbsp;·&nbsp; <b>F</b> album &nbsp;·&nbsp; <b>R</b> reset &nbsp;·&nbsp; <b>E</b> scrolls &nbsp;·&nbsp; <b>P</b> stats
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
