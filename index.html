<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sphere game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d1f; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cdd3f0;
        text-align: center;
        letter-spacing: 0.04em;
        background: rgba(10, 13, 31, 0.55);
        padding: 10px 20px;
        border-radius: 10px;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #hud.faded { opacity: 0.18; }
      #hud b { color: #ffd9a8; font-weight: 600; }

      /* Per-planet panel: whichever world you're standing on, and its keepsake. */
      #planet-panel {
        position: fixed;
        top: 24px;
        left: 24px;
        min-width: 208px;
        padding: 14px 18px 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e6e9fb;
        background: rgba(16, 13, 38, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 12px;
        pointer-events: none;
        backdrop-filter: blur(6px);
      }
      #planet-panel .planet-name {
        font-size: 17px;
        letter-spacing: 0.06em;
        color: #ffe3b8;
        margin-bottom: 9px;
      }
      #planet-panel .item-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #planet-panel .chip {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        transform: rotate(45deg);
        opacity: 0.4;
        flex: none;
      }
      #planet-panel .chip.found { opacity: 1; box-shadow: 0 0 9px currentColor; }
      #planet-panel .item-name { color: #cfd5f2; }
      #planet-panel .item-state {
        margin-left: auto;
        font-size: 11px;
        color: #7d84ac;
      }
      #planet-panel .item-state.found { color: #86e5a8; }
      #planet-panel .progress {
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11px;
        color: #8b91b8;
      }

      #toast {
        position: fixed;
        top: 34px;
        left: 50%;
        transform: translateX(-50%) translateY(-12px);
        font: 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        padding: 12px 22px;
        border-radius: 10px;
        background: rgba(16, 13, 38, 0.7);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* Press P. Numbers from your own GPU, not from a guess. */
      #perf {
        position: fixed;
        top: 24px;
        right: 24px;
        padding: 10px 14px;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfe6ff;
        background: rgba(10, 13, 31, 0.72);
        border-radius: 9px;
        white-space: pre;
        pointer-events: none;
        display: none;
      }
      #perf.on { display: block; }
    </style>
  </head>
  <body>
    <div id="hud">
      <b>click</b> to look around &nbsp;·&nbsp; <b>WASD</b> walk &nbsp;·&nbsp;
      <b>space</b> jump (hold to leap further) &nbsp;·&nbsp; <b>R</b> reset &nbsp;·&nbsp; <b>P</b> stats
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
